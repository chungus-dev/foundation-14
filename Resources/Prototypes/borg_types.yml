# Janitor borg
- type: borgType
  id: janitor

  # Sunrise-Start
  # Scp edit - job no longer exists on BorgTypePrototype.
  # job: JanitorBorg
  # Sunrise-End

  # Description
  dummyPrototype: BorgChassisJanitor

  # Functional
  extraModuleCount: 4
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleJanitor

  defaultModules:
  - BorgModuleTool # Scp edit - BorgModuleStandart is unavailable.
  - BorgModuleCleaning
  - BorgModuleCustodial

  radioChannels: # Fire Edit
  - ScientificService
  - FoodAndSanitationService

  # Sunrise-Start
  # Scp edit start - old Sunrise janitor borg footstep collection is unavailable.
#   footstepCollection:
# Scp edit - disabled broken ported content.     collection: FootstepJanitorBorg
  #   params:
  #     volume: -5
  # Scp edit end
  # Sunrise-Start

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: janitor
  spriteBodyMovementState: janitor_moving
  spriteHasMindState: janitor_e
  spriteNoMindState: janitor_e_r
  spriteToggleLightState: janitor_l

  # Pet
  petSuccessString: petting-success-janitor-cyborg
  petFailureString: petting-failure-janitor-cyborg
  addComponents:
#  - type: FootprintAreaCleaner # SCP port: component unavailable in Foundation14
  - type: Absorbent
    pickupAmount: 500
  - type: SolutionContainerManager
    solutions:
      absorbed:
        maxVol: 500
  - type: Spillable
    solution: absorbed
  - type: RefillableSolution
    solution: absorbed

# Medical borg
