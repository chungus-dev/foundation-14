# Generic borg
- type: borgType
  id: generic

  # Sunrise-Start
# Scp edit - disabled broken ported content.   job: Borg
  # Sunrise-End
#
  # Description
  dummyPrototype: BorgChassisGeneric

  # Functional
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleScience #until sciborgs are added

  defaultModules:
  - BorgModuleTool
  - BorgModuleInflatable
  - BorgModuleArtifact
  - BorgModuleAnomaly

  radioChannels: # Fire Edit
  - ScientificService

  # Sunrise-Start
  # Scp edit start - old Sunrise borg footstep collection is unavailable.
#   footstepCollection:
# Scp edit - disabled broken ported content.     collection: FootstepCyborgSpider
  #   params:
  #     volume: -15
  # Scp edit end
  # Sunrise-End

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: robot
  spriteHasMindState: robot_e
  spriteNoMindState: robot_e_r
  spriteToggleLightState: robot_l

  # Pet
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg


# Engineering borg
- type: borgType
  id: engineering

  # Sunrise-Start
  # Scp edit - job no longer exists on BorgTypePrototype.
  # job: EngineerBorg
  # Sunrise-End

  # Description
  dummyPrototype: BorgChassisEngineer

  # Functional
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleEngineering

  defaultModules:
# Scp edit - disabled broken ported content.   - BorgModuleStandart
  - BorgModuleAdvancedTool
  - BorgModuleCable
  - BorgModuleConstruction
  - BorgModuleRCD

  radioChannels: # Fire Edit
  - ScientificService
  - EngineeringTechnicalService

  # Sunrise-Start
  footstepCollection:
    collection: FootstepCyborgSpider
    params:
      volume: -15
