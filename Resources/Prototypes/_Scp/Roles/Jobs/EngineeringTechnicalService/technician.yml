- type: job
  id: Technician
  name: job-name-technician
  description: job-description-technician
  playTimeTracker: JobTechnician
  requirements:
  - !type:DepartmentTimeRequirement
    department: EngineeringTechnicalService
    time: 2h
  - !type:AgeRequirement
    requiredAge: 27
  - !type:AgeRequirement
    requiredAge: 75
    inverted: true
  icon: JobTechnician
  supervisors: job-supervisors-chief-engineer
  displayWeight: 10
  weight: 750
  accessGroups:
  - CommonEngineeringJob
  special:
  - !type:AddComponentSpecial
    components:
    - type: EmployeeClass
      class: C
    - type: AccessLevel
      level: Two
    - type: ScpRepairableCanSeeExamineHints

- type: startingGear
  id: TechnicianGear
  equipment:
    head: ClothingHeadHatBeretEngineering
    eyes: ClothingEyesGlassesMeson
    mask: ClothingMaskBandRed
    neck: ClothingNeckScarfStripedRed
    outerClothing: ClothingOuterWinterColorRed
    jumpsuit: ClothingUniformJumpsuitEngineering
    gloves: ClothingHandsGlovesFingerlessInsulated
    shoes: ClothingShoesColorRed
    back: ClothingBackpackEngineering
    id: KeyCardTechnician
    ears: ClothingHeadsetEngineeringTechnicalService
    belt: ClothingBeltUtilityEngineering
    pocket2: ScpEngineeringPDA
