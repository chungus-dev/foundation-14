- type: job
  id: JuniorCommandant
  name: job-name-junior-commandant
  description: job-description-junior-commandant
  playTimeTracker: JobJuniorCommandant
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 3h
  - !type:AgeRequirement
    requiredAge: 23
  - !type:AgeRequirement
    requiredAge: 45
    inverted: true
  icon: JobJuniorCommandant
  supervisors: job-supervisors-commandant-leader
  displayWeight: 0
  weight: 810
  accessGroups:
  - SecurityJobCommon
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: EmployeeClass
      class: C
    - type: AccessLevel
      level: Three
    - type: ScpHolder
      holdableWhitelist:
        components:
        - HumanoidProfile
      holdableBlacklist:
        components:
        - Scp
    - type: SpeakOnEyeStateChange # переопределение моргания с другими параметрами для охраны и МОГа
      # Часть фраз уходит, так как более разговорная. А эти парни натренированы.
      phraseOnClose:
      - close-eye-phrase-1
      - close-eye-phrase-3
      - close-eye-phrase-4
      phraseOnOpen:
      - open-eye-phrase-1
      - open-eye-phrase-3
      speakOnAutomaticBlinking: true
      speakOnlyInScp173Chamber: false
    - type: Fear # переопределение компонента страха для СБ
      phobias:
      - Exoremophobia
      - Necrophobia
      proximityBlockerLevel: None
      seenBlockerLevel: None
      fearBasedSpreadAngleModifier:
        Anxiety: 1.7
        Fear: 2.2
        Terror: 5
      baseJitterTime: 3
      fallOffChance: 0.02

- type: startingGear
  id: JuniorCommandantGear
  equipment:
    head: ClothingHeadHelmetSecurity
    eyes: ClothingEyesGlassesSecurityGuard
    mask: ClothingMaskSecurityBandBlack
    jumpsuit: ClothingUniformSecurity2
    outerClothing: ClothingOuterArmorSecurity
    gloves: ClothingHandsGlovesSecurity
    shoes: ClothingShoesBootsSecurityGuard
    back: ClothingBackpackSecurity
    id: KeyCardJuniorCommandant
    ears: ClothingHeadsetCommandantSquad
    belt: ScpClothingBeltSecurityWebbingFilled
    pocket2: ScpSecurityPDA
  storage:
    back:
    - ScpRadioHandheldSecurityEnabled
