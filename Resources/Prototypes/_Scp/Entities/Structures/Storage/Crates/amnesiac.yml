- type: entity
  id: CrateChemistryRawAmnesiac
  parent: CrateChemistrySecure
  name: Amnesiac container
  description: Contains jug of raw amnesiac used for producing amnesiacs.
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
          - id: JugRawAmnesiac
            amount: 1
    - type: AccessReader
      access: [ [ "Laboratory" ] ]

