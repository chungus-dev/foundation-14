# non-stealth Chaos stuff
- type: entity
  id: BaseChaosContraband
  abstract: true
  components:
  - type: Contraband
    severity: Chaos

# non-stealth Foundation enemy stuff
- type: entity
  id: BaseFoundationEnemyContraband
  abstract: true
  components:
  - type: Contraband
    severity: FoundationEnemy

# SCP security uniform and equipment restricted to all site security departments.
- type: entity
  id: BaseScpSecurityContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ SpecialPurposeSquad, CommandantSquad ]

# SCP security uniform and equipment restricted to the Special Purpose Squad.
- type: entity
  id: BaseSpecialPurposeSquadContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ SpecialPurposeSquad ]

# SCP security uniform and equipment restricted to the Commandant Squad.
- type: entity
  id: BaseCommandantSquadContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ CommandantSquad ]
