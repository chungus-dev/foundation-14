name: Localization Automation

on:
  workflow_dispatch:
    inputs:
      source_culture:
        description: Source locale culture.
        required: true
        default: en-US
      target_culture:
        description: Target locale culture.
        required: true
        default: ru-RU
      translate:
        description: Run AI translation after syncing missing strings.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: localization-automation-${{ github.ref_name }}-${{ inputs.target_culture }}
  cancel-in-progress: false

jobs:
  localization:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare localization branch
        id: branch
        shell: bash
        run: |
          branch="automation/localization-${{ inputs.target_culture }}"
          base="${{ github.ref_name }}"
          git config user.name "foundation-14-localization[bot]"
          git config user.email "foundation-14-localization[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch -C "$branch" "origin/$branch"
            git merge --no-edit "origin/$base"
          else
            git switch -c "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Sync missing Fluent strings
        run: >
          python Tools/Localization/run.py sync-strings
          --source-culture "${{ inputs.source_culture }}"
          --target-culture "${{ inputs.target_culture }}"

      - name: Extract entity prototype localizations
        run: >
          python Tools/Localization/run.py extract-prototypes
          --culture "${{ inputs.target_culture }}"

      - name: Translate synced files
        if: ${{ inputs.translate }}
        env:
          F14_AI_BASE_URL: ${{ secrets.F14_AI_BASE_URL || 'https://models.github.ai/inference' }}
          F14_AI_MODEL: ${{ secrets.F14_AI_MODEL || 'openai/gpt-4o-mini' }}
          F14_AI_KEYS: ${{ secrets.F14_AI_KEYS || secrets.GITHUB_TOKEN }}
          F14_AI_PROXIES: ${{ secrets.F14_AI_PROXIES }}
        run: |
          mapfile -t files < <(find "Resources/Locale/${{ inputs.target_culture }}" -name '*.ftl' -print | sort)
          if [ "${#files[@]}" -gt 0 ]; then
            python Tools/Localization/run.py translate \
              --source-culture "${{ inputs.source_culture }}" \
              --target-culture "${{ inputs.target_culture }}" \
              --allow-partial \
              "${files[@]}"
          fi

      - name: Normalize target locale
        run: >
          python Tools/Localization/run.py normalize
          --culture "${{ inputs.target_culture }}"

      - name: Validate target locale
        run: >
          python Tools/Localization/run.py validate
          --source-culture "${{ inputs.source_culture }}"
          --target-culture "${{ inputs.target_culture }}"
          --fail-on-errors

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Resources/Locale)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open localization PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${{ steps.branch.outputs.branch }}"
          base="${{ steps.branch.outputs.base }}"
          git add Resources/Locale
          git commit -m "Automate localization update"
          git push --set-upstream origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          body="Generated by Localization Automation workflow ${{ github.run_id }}."
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Automated localization update" --body "$body" --base "$base"
          else
            gh pr create \
              --title "Automated localization update" \
              --body "$body" \
              --base "$base" \
              --head "$branch"
          fi
